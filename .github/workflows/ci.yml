name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IS_MAIN: ${{ github.ref == 'refs/heads/main' }}

jobs:
  backend-test:
    name: Backend lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check --select=E9,F63,F7,F82 backend/

      - name: Smoke test
        env:
          PYTHONPATH: .
        run: pytest tests/ -v

  frontend-test:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
        env:
          VITE_API_BASE_URL: http://localhost:8000

  docker-backend:
    name: Docker backend
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.IS_MAIN == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend (main)
        if: env.IS_MAIN == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/agroarc-backend:main
            ghcr.io/${{ github.repository }}/agroarc-backend:latest
            ghcr.io/${{ github.repository }}/agroarc-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build backend (PR)
        if: env.IS_MAIN != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: agroarc-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Smoke test backend
        run: |
          if [ "${{ env.IS_MAIN }}" = "true" ]; then
            IMAGE="ghcr.io/${{ github.repository }}/agroarc-backend:main"
            docker pull "$IMAGE"
          else
            IMAGE="agroarc-backend:ci"
          fi
          docker run -d --name agroarc-backend-ci -p 8000:8000 "$IMAGE"
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null \
              && curl -fsS http://127.0.0.1:8000/api/v1/crop/health > /dev/null; then
              echo "Backend healthy on attempt $i"
              exit 0
            fi
            sleep 2
          done
          docker logs agroarc-backend-ci
          exit 1

      - name: Cleanup backend container
        if: always()
        run: docker rm -f agroarc-backend-ci || true

  docker-frontend:
    name: Docker frontend
    runs-on: ubuntu-latest
    needs: frontend-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.IS_MAIN == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend (main)
        if: env.IS_MAIN == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          build-args: VITE_API_BASE_URL=http://localhost:8000
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/agroarc-frontend:main
            ghcr.io/${{ github.repository }}/agroarc-frontend:latest
            ghcr.io/${{ github.repository }}/agroarc-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build frontend (PR)
        if: env.IS_MAIN != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          build-args: VITE_API_BASE_URL=http://localhost:8000
          push: false
          load: true
          tags: agroarc-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke test frontend
        run: |
          if [ "${{ env.IS_MAIN }}" = "true" ]; then
            IMAGE="ghcr.io/${{ github.repository }}/agroarc-frontend:main"
            docker pull "$IMAGE"
          else
            IMAGE="agroarc-frontend:ci"
          fi
          docker run -d --name agroarc-frontend-ci -p 3000:80 "$IMAGE"
          for i in {1..15}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/healthz || echo "000")
            if [ "$status" = "200" ]; then
              echo "Frontend healthy on attempt $i"
              exit 0
            fi
            sleep 1
          done
          docker logs agroarc-frontend-ci
          exit 1

      - name: Cleanup frontend container
        if: always()
        run: docker rm -f agroarc-frontend-ci || true

  publish:
    name: GHCR public & compose E2E
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set GHCR package visibility to public
        uses: actions/github-script@v7
        with:
          script: |
            const names = [
              'agroarc-backend',
              'agroarc-frontend',
              'agroarc/agroarc-backend',
              'agroarc/agroarc-frontend',
            ];
            for (const package_name of names) {
              try {
                await github.rest.packages.setPackageVisibilityForAuthenticatedUser({
                  package_type: 'container',
                  package_name,
                  visibility: 'public',
                });
                core.info(`Public: ${package_name}`);
              } catch (error) {
                core.warning(`${package_name}: ${error.message}`);
              }
            }

      - name: Generate backend .env from secrets
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: |
          cat > backend/.env <<EOF
          OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
          GEMINI_API_KEY=${GEMINI_API_KEY:-}
          GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
          EOF
          chmod 600 backend/.env

      - name: Compose smoke test
        run: |
          docker compose up -d
          for i in {1..60}; do
            backend=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/v1/crop/health || echo "000")
            frontend=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/healthz || echo "000")
            if [ "$backend" = "200" ] && [ "$frontend" = "200" ]; then
              echo "Compose stack healthy on attempt $i"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Cleanup compose stack
        if: always()
        run: docker compose down -v --remove-orphans
