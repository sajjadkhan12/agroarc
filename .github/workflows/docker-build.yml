name: Docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/agroarc-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/agroarc-frontend

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (real bug rules only)
        run: ruff check --select=E9,F63,F7,F82 backend/

      - name: Smoke test
        env:
          PYTHONPATH: .
        run: pytest tests/ -v

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (no emit)
        run: npx tsc --noEmit

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npx vite build

  backend-image:
    name: Build backend image
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          load: true
          tags: |
            agroarc-backend:ci
            ${{ env.BACKEND_IMAGE }}:main
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Verify image starts and models load
        run: |
          docker run -d --name agroarc-backend-ci -p 8000:8000 agroarc-backend:ci
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null \
              && curl -fsS http://127.0.0.1:8000/api/v1/crop/health > /dev/null; then
              echo "Backend healthy on attempt $i"
              curl -s http://127.0.0.1:8000/api/v1/crop/health | head -c 500
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          docker logs agroarc-backend-ci
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f agroarc-backend-ci || true

  frontend-image:
    name: Build frontend image
    runs-on: ubuntu-latest
    needs: frontend-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000
          push: ${{ github.ref == 'refs/heads/main' }}
          load: true
          tags: |
            agroarc-frontend:ci
            ${{ env.FRONTEND_IMAGE }}:main
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Verify image serves /healthz
        run: |
          docker run -d --name agroarc-frontend-ci -p 3000:80 agroarc-frontend:ci
          for i in {1..15}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/healthz || echo "000")
            if [ "$status" = "200" ]; then
              echo "Frontend /healthz returned 200 on attempt $i"
              exit 0
            fi
            sleep 1
          done
          echo "Frontend did not respond on /healthz in time"
          docker logs agroarc-frontend-ci
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f agroarc-frontend-ci || true

  compose-e2e:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend-image, frontend-image]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate backend .env from secrets
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: chmod +x scripts/generate-backend-env.sh && ./scripts/generate-backend-env.sh

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          for i in {1..60}; do
            backend=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/v1/crop/health || echo "000")
            frontend=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/healthz || echo "000")
            if [ "$backend" = "200" ] && [ "$frontend" = "200" ]; then
              echo "Compose stack healthy on attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "Compose stack did not become healthy in time"
          docker compose ps
          docker compose logs
          exit 1

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
