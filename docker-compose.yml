services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: agroarc-backend:latest
    container_name: agroarc-backend
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: false
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - agroarc

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: agroarc-frontend:latest
    container_name: agroarc-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - agroarc

networks:
  agroarc:
    driver: bridge
