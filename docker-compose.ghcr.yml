# Run pre-built images from GitHub Container Registry (CI publishes linux/amd64 on main).
#
# Apple Silicon (M1/M2/M3): use platform linux/amd64 below (Docker Desktop emulates it).
#
# Prerequisites:
#   1. Successful CI on main: https://github.com/sajjadkhan12/agroarc/actions
#   2. Packages public: https://github.com/sajjadkhan12/agroarc/pkgs/container/agroarc-backend
#   3. Optional: cp backend/.env.example backend/.env
#
# If pull fails with "denied" on public packages:
#   docker logout ghcr.io
#
# Usage:
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d

services:
  backend:
    image: ghcr.io/${GHCR_REPO:-sajjadkhan12/agroarc}/agroarc-backend:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: agroarc-backend
    restart: unless-stopped
    pull_policy: always
    env_file:
      - path: backend/.env
        required: false
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - agroarc

  frontend:
    image: ghcr.io/${GHCR_REPO:-sajjadkhan12/agroarc}/agroarc-frontend:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: agroarc-frontend
    restart: unless-stopped
    pull_policy: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - agroarc

networks:
  agroarc:
    driver: bridge
